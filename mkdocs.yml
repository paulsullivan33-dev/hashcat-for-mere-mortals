site_name: Hashcat for Mere Mortals
site_description: Recovering and auditing your own passwords with hashcat. How password hashes work and why the weak ones fall, dictionary, mask and rules attacks run for real against hashes the lab made itself, and the measured gap between fast hashes and slow salted ones, with the rules and the limits stated plainly.
